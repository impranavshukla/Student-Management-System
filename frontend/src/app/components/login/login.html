<div class="login-wrapper">
  <div class="login-card">

    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue</p>

    <form [formGroup]="loginData">
      <!-- Email -->
      <div class="input-group">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="Enter your email" />
      </div>

      <!-- Password -->
      <div class="input-group">
        <label>Password</label>
        <input formControlName="password" type="password" placeholder="Enter your password" />
      </div>

      <!-- Options -->
      <div class="options">
        <label>
          <input type="checkbox" />
          Remember me
        </label>
        <a href="#">Forgot Password?</a>
      </div>

      <button (click)="onLogin()"  class="login-btn">
        Login
      </button>
    </form>

    <p class="register-text">
      Don’t have an account?
      <a routerLink="/signup">Register</a>
    </p>

  </div>
</div>
