<!-- HERO SECTION -->
<section class="hero">
  <div class="hero-content">
    <h1>Student Management System</h1>
    <p>Manage student records, attendance and performance efficiently</p>
    <button class="hero-btn">Explore Students</button>
  </div>
</section>

<div class="container">

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" placeholder="Search student..." class="search-input">
    <button class="search-btn">Search</button>
  </div>

  <div class="cards-wrapper">
  <div class="student-card" *ngFor="let student of students()">

    <div class="card-top">
      <div class="avatar">
        {{ student.name.charAt(0) }}
      </div>
      <div class="student-id">
        ID: {{ student.id }}
      </div>
    </div>

    <div class="card-body">
      <h3>{{ student.name }}</h3>
      <p class="email">{{ student.email }}</p>
      <!-- <p class="age">Age: {{ student.age }}</p> -->
    </div>

    <div class="card-actions">
      <button class="edit-btn">Edit</button>
      <button (click)="deleteStudent(student.id)" class="delete-btn">Delete</button>
    </div>

  </div>
</div>

</div>
