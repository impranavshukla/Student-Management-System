<div class="main">

  <div class="form-container">
    <h2>Add Student</h2>

    <form [formGroup]="studentForm" (ngSubmit)="submit()" class="student-form">

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter full name" formControlName="name">
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter email address" formControlName="email">
      </div>

      <div class="input-group">
        <label>Age</label>
        <input type="number" placeholder="Enter age" formControlName="age">
      </div>

      <button type="submit" class="submit-btn">Add Student</button>

    </form>
  </div>

</div>
